<div class="cascade-visualizer cv-animating" id="cascade-vis">
  <div class="cv-lane">
    <!-- Attacker -->
    <div class="cv-card cv-attacker" id="vis-attacker">
      <span class="cv-suit suit-s">♠</span>
      <span class="cv-rank">A</span>
      <div class="cv-label">ATTACKER</div>
    </div>
    
    <!-- Connector Path -->
    <div class="cv-path">
      <div class="cv-pulse"></div>
    </div>

    <!-- Front Rank -->
    <div class="cv-card cv-defender" id="vis-front">
      <span class="cv-suit suit-d">♦</span>
      <span class="cv-rank">K</span>
      <div class="cv-label">FRONT RANK</div>
      <div class="cv-impact"></div>
    </div>

    <!-- Carryover Path -->
    <div class="cv-path cv-carry">
      <div class="cv-pulse"></div>
    </div>

    <!-- Back Rank -->
    <div class="cv-card cv-defender" id="vis-back">
      <span class="cv-suit suit-h">♥</span>
      <span class="cv-rank">7</span>
      <div class="cv-label">BACK RANK</div>
    </div>

    <!-- Breach Path -->
    <div class="cv-path cv-breach">
      <div class="cv-pulse"></div>
    </div>

    <!-- Core -->
    <div class="cv-card cv-core" id="vis-core">
      <span class="cv-suit suit-h">♥</span>
      <span class="cv-rank">LP</span>
      <div class="cv-label">CORE (LP)</div>
    </div>
  </div>
</div>
