{% assign section = include.section %}
<section class="{{ section.class | default: 'two-col' }}">
  {% for card in section.cards %}
    <article class="card">
      <h2>{{ card.heading }}</h2>
      <p>{{ card.body }}</p>
      {% if card.cta %}
        {% include home/cta-link.html cta=card.cta %}
      {% endif %}
    </article>
  {% endfor %}
</section>
