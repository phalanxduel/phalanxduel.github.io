{% assign section = include.section %}
<section class="container {{ section.class | default: 'two-col' }}" style="padding: 6rem 0;">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1px; background: var(--grid-line-bold); border: 1px solid var(--grid-line-bold);">
    {% for card in section.cards %}
      <article class="card" style="background: var(--color-bg); padding: 4rem; border: none; margin: 0; transition: var(--transition);">
        <h2 style="font-size: 2rem; margin-bottom: 1.5rem; color: #fff;">{{ card.heading }}</h2>
        <p style="font-size: 1.1rem; color: var(--color-text-dim); margin-bottom: 2.5rem;">{{ card.body }}</p>
        {% if card.cta %}
          <div style="margin-top: auto;">
            {% include home/cta-link.html cta=card.cta %}
          </div>
        {% endif %}
      </article>
    {% endfor %}
  </div>
</section>
