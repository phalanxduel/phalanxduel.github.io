        title: "Game Theory of Phalanx Duel: Zero-RNG Geometry & Tempo"
        format: "16:9"
        format_label: "Deep Dive (16:9)"
        duration_label: "34s"
        summary: "Explore the game theory behind Phalanx Duel: deterministic 2x4 column geometry, tempo commitment, and integer combat resolution with zero RNG."
        companion_url: "/about/philosophy/"
        youtube_id: ""
        transcript:
          - "Phalanx Duel is built on a single design thesis: zero combat randomness. Once cards hit the two-by-four phalanx, every point of damage is pure geometric consequence — no dice rolls, no critical-hit RNG, and no hidden modifiers."
          - "Each column is a two-rank commitment. Your front rank shields your back rank, and your back rank shields your life points. Deploying a card is both an offense and a promise about which lane you are willing to defend."
          - "Because every resolution follows Shield, then Weapon, then Clamp in strict integer arithmetic, you can forecast every strike before you click and verify every outcome afterward in the Combat Math ledger."
      - id: "ep-24-suit-spades-blade"
        episode_number: 24
        title: "The Suits: Spades — The Player-Boundary Finisher"
        format: "9:16"
        format_label: "Short (9:16)"
        duration_label: "24s"
        summary: "Meet Spades: the Player-Boundary Weapon that doubles overflow damage the moment your attack reaches the opponent's life points."
        companion_url: "/mastery/mastery/"
        youtube_id: ""
        transcript:
          - "Spades are the executioner's blade of Phalanx Duel. Unlike Clubs, Spades do not boost damage between cards — they wait for the final Card-to-Player boundary."
          - "Whenever an attacking Spade breaks through a column and carries damage directly into the opponent's life points, that remaining overflow is doubled. Hold your high Spades for open lanes or wounded columns to close out the match in one lethal strike."
      - id: "ep-25-suit-clubs-cleave"
        episode_number: 25
        title: "The Suits: Clubs — The Card-Boundary Cleave"
        format: "9:16"
        format_label: "Short (9:16)"
        duration_label: "24s"
        summary: "Meet Clubs: the Card-Boundary Weapon that doubles carryover after destroying the front rank to cleave straight through the back rank."
        companion_url: "/mastery/mastery/"
        youtube_id: ""
        transcript:
          - "Clubs are the battering ram of the phalanx. They trigger at the Card-to-Card boundary — right after your Club destroys the opponent's front-rank defender."
          - "The excess damage carrying into the back-rank card is doubled once per attack. Aim Clubs at thin front-rank shields to shatter an entire stacked column in a single turn."
      - id: "ep-26-suit-diamonds-aegis"
        episode_number: 26
        title: "The Suits: Diamonds — The Front-Rank Shield"
        format: "9:16"
        format_label: "Short (9:16)"
        duration_label: "24s"
        summary: "Meet Diamonds: the Card-Boundary Shield that absorbs carryover before an attacking Club can double it."
        companion_url: "/mastery/mastery/"
        youtube_id: ""
        transcript:
          - "Diamonds are your column firewall. When a defending Diamond is destroyed in front of another card, its shield triggers at the Card-to-Card boundary."
          - "Because Phalanx Duel resolves Shield before Weapon, a Diamond subtracts its value from overflow before an attacking Club can double it. Place Diamonds on the front rank to protect high-value back-rank attackers."
      - id: "ep-27-suit-hearts-ward"
        episode_number: 27
        title: "The Suits: Hearts — The Life-Point Ward"
        format: "9:16"
        format_label: "Short (9:16)"
        duration_label: "24s"
        summary: "Meet Hearts: the Player-Boundary Shield that anchors your back rank and blunts Spade breakthroughs before they hit your life points."
        companion_url: "/mastery/mastery/"
        youtube_id: ""
        transcript:
          - "Hearts are your last line of defense. A Heart triggers at the Card-to-Player boundary — only when it is the final card destroyed right before damage reaches your life points."
          - "Hearts do not stack, and they fire before an attacking Spade doubles overflow. Anchor your back rank with a Heart to neutralize lethal Spade breakthroughs and buy yourself the tempo turn you need to counterattack."
