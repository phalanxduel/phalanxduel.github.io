meta:
  title: "Phalanx Duel"
  description: "A standard deck, sharpened. The deterministic tactical card battle."

active_variant: "embed_conversion_v1"

variants:
  tactical_v1:
    name: "Tactical Overthrow v1.6.0"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "The Definitive Tactical Duel."
        body: "Phalanx Duel v1.6.0 is live. A deterministic tactical battle on a 4x2 grid with authoritative combat mathematics, replay-verifiable outcomes, and cinematic explanations of every breach. Red protects. Blue attacks. Master the cascade."
        proof_points:
          - "Deterministic: 0% RNG"
          - "Open: Standard 52-Card Deck"
          - "Tactical: 4x2 Formation Grid"
        ctas:
          - label: "Enter the Duel"
            href: "/play/"
            style: "primary"
            external: false
          - label: "Read the Rules"
            href: "/guide"
            style: "secondary"
        asset_id: "mkt-hero-breach"
        friction_line: "No account required. Logic is the only weapon."
        preview_panel:
          label: "The Front Rank"
          heading: "Formation is Destiny"
          subheading: "Predictable combat. Zero luck."
          rows:
            - label: "Defense"
              value: "♥ Heart + ♦ Diamond"
              href: "/learn/rules/"
            - label: "Offense"
              value: "♣ Club + ♠ Spade"
              href: "/learn/rules/"
            - label: "Simulation"
              value: "Combat Lab"
              href: "/tools/battle-calculator/"
          footer: "Red defends the line. Blue breaks it."

      - type: "feature_showcase"
        class: "card"
        section_id: "the-killzone"
        heading: "A System of Consequences."
        intro: "We stripped away the RNG. What remains is a pure system of geometric pressure and structural integrity."
        features:
          - heading: "01. Formation"
            body: "Your 4x2 grid is your survival. A gap in the front rank is an invitation to destruction. Every card is a tactical decision."
            asset_id: "tut-foundations-setup"
          - heading: "02. The Cascade"
            body: "Damage flows front-to-back. Suits like Diamonds and Clubs modify the kinetic energy as it breaches each rank."
            asset_id: "tut-foundations-cascade"
          - heading: "03. Determinism"
            body: "Identical inputs. Identical outcomes. Your victory is not a roll of the dice; it is the mathematical inevitable."
            image: "/assets/images/tutorial/qa-determinism.png"
        ctas:
          - label: "Enter the Combat Lab &rarr;"
            href: "/tools/battle-calculator/"
            style: "primary"

      - type: "welcome_dialog"
        heading: "WELCOME TO PHALANX DUEL"

      - type: "card"
        class: "card"
        section_id: "the-death-of-luck"
        heading: "The Death of Luck"
        paragraphs:
          - "In Phalanx Duel, there are no coin flips. Identical inputs produce identical outcomes. Every combat result is hashable, verifiable, and mathematically inevitable. Your victory is yours alone."
        links_line:
          links:
            - label: "Read the System Philosophy"
              href: "/about/philosophy/"
            - label: "Analyze the Math"
              href: "/tools/battle-calculator/"
          conjunction: " or "
          suffix: "."

      - type: "two_col_cards"
        class: "two-col"
        cards:
          - heading: "The Simulator"
            body: "Study attack boundaries, carryover math, and suit interactions in our high-fidelity combat lab."
            cta:
              label: "Open Simulator"
              href: "/tools/battle-calculator/"
          - heading: "The Forge"
            body: "The engine is open. We need designers, developers, and playtesters to sharpen the edge."
            cta:
              label: "Help Build It"
              href: "/contribute/"

      - type: "final_cta"
        class: "card"
        section_id: "final-strike"
        heading: "Ready to Duel?"
        body: "Create a match. Share a link. Start the duel in seconds."
        ctas:
          - label: "Start Match"
            href: "/play/"
            style: "primary"
            external: false
          - label: "First Match Walkthrough"
            href: "/learn/first-match/"
            style: "secondary"
        closing_microcopy: "Free. Fast. Fair."

  embed_conversion_v1:
    name: "Vector Command v1.6.0"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "A Card Duel With Zero Luck."
        body: "Phalanx Duel is a free two-player game played on a 4x2 grid of cards. Every attack resolves by fixed arithmetic, so you can see what a move will do before you make it. Play in your browser, at a table with a standard deck, or from the terminal."
        proof_points:
          - "No randomness in combat"
          - "Standard 52-card deck"
          - "4x2 formation grid"
        ctas:
          - label: "Play Now"
            href: "#play-the-duel"
            style: "primary"
          - label: "Learn in 5 Minutes"
            href: "/learn/getting-started/"
            style: "secondary"
        asset_id: "mkt-hero-breach"
        friction_line: "No account needed. Just pick a card."
        preview_panel:
          label: "The basics"
          heading: "Four suits, two jobs"
          subheading: "Hearts and Diamonds defend. Clubs and Spades attack."
          rows:
            - label: "Defense"
              value: "♥ Heart + ♦ Diamond"
              href: "/learn/rules/"
            - label: "Offense"
              value: "♣ Club + ♠ Spade"
              href: "/learn/rules/"
            - label: "Practice"
              value: "Combat Lab"
              href: "/tools/battle-calculator/"
          footer: "Red defends the line. Blue breaks it."

      - type: "onboarding_choices"
        class: "card"
        section_id: "choose-your-path"
        heading: "Pick How You Want to Play"
        body: "Phalanx Duel works in a browser, on a table, and in code."
        cards:
          - heading: "Play in Your Browser"
            body: "Free, with no signup. Start a practice match against a bot in seconds, or send a friend a link."
            cta:
              label: "Start a Match"
              href: "/play/"
          - heading: "Play With a Deck of Cards"
            body: "All you need is a standard 52-card deck. Print the two-page quickstart and suit cards and play face to face."
            cta:
              label: "See the Tabletop Rules"
              href: "/learn/rules/"
          - heading: "Build or Test an AI Agent"
            body: "A Go CLI, REST and WebSocket SDKs, and an MCP server let you write your own client or test an AI agent against the engine."
            cta:
              label: "Build With Phalanx"
              href: "/build-with-phalanx/"
        helper_line: "New to the game? Start with the five-minute guide or the 25-second intro video."

      - type: "cascade_visualizer"
        section_id: "the-math"

      - type: "card"
        class: "card"
        section_id: "play-the-duel"
        heading: "Try It Right Here"
        body: "Start a practice match without leaving this page. No setup, no account."
        embed:
          enabled: true
          src: "https://play.phalanxduel.com/"
          title: "Phalanx Duel Playable Embed"
          aspect_ratio: "16/9"
          sandbox: "allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
          allow: "clipboard-write; fullscreen"
          loading: "lazy"
        ctas:
          - label: "Open Full Screen &rarr;"
            href: "/play/"
            style: "secondary"

      - type: "feature_showcase"
        class: "card"
        section_id: "the-killzone"
        heading: "Why It Works"
        intro: "Combat has no dice and no hidden rolls. What's left is formation, timing, and arithmetic you can check yourself."
        features:
          - heading: "01. Build a formation"
            body: "Your 4x2 grid is your defense. A gap in the front rank is an opening for your opponent, so every placement matters."
            asset_id: "tut-foundations-setup"
          - heading: "02. Watch the cascade"
            body: "Damage flows from the front card to the back card to Life Points, and suits can shrink or double it at specific points along the way. In Classic mode, surviving cards return to full strength. In Cumulative mode, damage sticks."
            asset_id: "tut-foundations-cascade"
          - heading: "03. Trust the result"
            body: "The same inputs always produce the same outcome, and every match can be replayed and verified. When you lose, it's because of a decision, not a roll."
            image: "/assets/images/tutorial/qa-determinism.png"
        ctas:
          - label: "Try the Combat Lab &rarr;"
            href: "/tools/battle-calculator/"
            style: "primary"

      - type: "welcome_dialog"
        heading: "Welcome to Phalanx Duel"

      - type: "two_col_cards"
        class: "two-col"
        section_id: "cross-platform"
        cards:
          - heading: "Play From the Terminal"
            body: "Prefer a command line? The official Go client, duel-cli, plays the same matches as the browser and can rejoin a game after a dropped connection."
            cta:
              label: "Get the Go Client"
              href: "https://github.com/phalanxduel/phalanxduel/tree/main/sdk/go"
          - heading: "Competitive Ladder (Beta)"
            body: "Climb a global Glicko-2 ladder with separate rankings for human opponents and each bot tier. Web, terminal, and API clients all play the same matches. A native SwiftUI client is in progress."
            cta:
              label: "See the Rankings"
              href: "/competitive/"

      - type: "card"
        class: "card"
        section_id: "the-death-of-luck"
        heading: "No Luck, On Purpose"
        paragraphs:
          - "Phalanx Duel has no coin flips and no random damage. The same inputs always produce the same outcome, and every result can be hashed, replayed, and checked. If you win, you earned it. If you lose, you can see exactly why."
        links_line:
          links:
            - label: "Read why it was designed this way"
              href: "/about/philosophy/"
            - label: "check the math yourself"
              href: "/tools/battle-calculator/"
          conjunction: " or "
          suffix: "."

      - type: "card"
        class: "card"
        section_id: "feedback"
        heading: "Help Improve the Game"
        body: "Phalanx Duel is in active playtesting. Your feedback shapes how the game evolves."
        bullets:
          - "Found a bug in the damage math?"
          - "Found a strategy that always wins?"
          - "Have an idea for a new suit rule?"
        ctas:
          - label: "Report a Bug on GitHub"
            href: "https://github.com/phalanxduel/phalanxduel/issues"
            style: "primary"
            external: true
          - label: "Share Playtest Feedback"
            href: "/contribute/playtesting/"
            style: "secondary"

      - type: "final_cta"
        class: "card"
        section_id: "final-strike"
        heading: "Ready to Play?"
        body: "Start a match, share the link, and play in seconds."
        ctas:
          - label: "Play Now"
            href: "/play/"
            style: "primary"
            external: false
          - label: "Learn the Rules"
            href: "/learn/getting-started/"
            style: "secondary"
        closing_microcopy: "Free to play. No signup needed."
