meta:
  title: "Phalanx Duel"
  description: "A standard deck, sharpened. The deterministic tactical card battle."

active_variant: "embed_conversion_v1"

variants:
  tactical_v1:
    name: "Tactical Overthrow v1.0"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "The Definitive Tactical Duel."
        body: "Phalanx Duel v1.0 is here. A deterministic tactical battle on a 4x2 grid. No luck. No boosters. Full cross-platform matchmaking and competitive Glicko rankings. Red protects. Blue attacks. Master the cascade."
        proof_points:
          - "Deterministic: 0% RNG"
          - "Open: Standard 52-Card Deck"
          - "Tactical: 4x2 Formation Grid"
        ctas:
          - label: "Enter the Duel"
            href: "/play/"
            style: "primary"
            external: false
          - label: "Read the Rules"
            href: "/guide"
            style: "secondary"
        asset_id: "mkt-hero-breach"
        friction_line: "No account required. Logic is the only weapon."
        preview_panel:
          label: "The Front Rank"
          heading: "Formation is Destiny"
          subheading: "Predictable combat. Zero luck."
          rows:
            - label: "Defense"
              value: "♥ Heart + ♦ Diamond"
              href: "/learn/rules/"
            - label: "Offense"
              value: "♣ Club + ♠ Spade"
              href: "/learn/rules/"
            - label: "Simulation"
              value: "Battle Lab"
              href: "/tools/battle-calculator/"
          footer: "Red defends the line. Blue breaks it."

      - type: "feature_showcase"
        class: "card"
        section_id: "the-killzone"
        heading: "A System of Consequences."
        intro: "We stripped away the RNG. What remains is a pure system of geometric pressure and structural integrity."
        features:
          - heading: "01. Formation"
            body: "Your 4x2 grid is your survival. A gap in the front rank is an invitation to destruction. Every card is a tactical decision."
            asset_id: "tut-foundations-setup"
          - heading: "02. The Cascade"
            body: "Damage flows front-to-back. Suits like Diamonds and Clubs modify the kinetic energy as it breaches each rank."
            asset_id: "tut-foundations-cascade"
          - heading: "03. Determinism"
            body: "Identical inputs. Identical outcomes. Your victory is not a roll of the dice; it is the mathematical inevitable."
            image: "/assets/images/tutorial/qa-determinism.png"
        ctas:
          - label: "Enter the Combat Lab &rarr;"
            href: "/tools/battle-calculator/"
            style: "primary"

      - type: "welcome_dialog"
        heading: "WELCOME TO PHALANX DUEL"

      - type: "card"
        class: "card"
        section_id: "the-death-of-luck"
        heading: "The Death of Luck"
        paragraphs:
          - "In Phalanx Duel, there are no coin flips. Identical inputs produce identical outcomes. Every combat result is hashable, verifiable, and mathematically inevitable. Your victory is yours alone."
        links_line:
          links:
            - label: "Read the System Philosophy"
              href: "/about/philosophy/"
            - label: "Analyze the Math"
              href: "/tools/battle-calculator/"
          conjunction: " or "
          suffix: "."

      - type: "two_col_cards"
        class: "two-col"
        cards:
          - heading: "The Simulator"
            body: "Study attack boundaries, carryover math, and suit interactions in our high-fidelity combat lab."
            cta:
              label: "Open Simulator"
              href: "/tools/battle-calculator/"
          - heading: "The Forge"
            body: "The engine is open. We need designers, developers, and playtesters to sharpen the edge."
            cta:
              label: "Help Build It"
              href: "/contribute/"

      - type: "final_cta"
        class: "card"
        section_id: "final-strike"
        heading: "Ready to Duel?"
        body: "Create a match. Share a link. Start the duel in seconds."
        ctas:
          - label: "Start Match"
            href: "/play/"
            style: "primary"
            external: false
          - label: "First Match Walkthrough"
            href: "/learn/first-match/"
            style: "secondary"
        closing_microcopy: "Free. Fast. Fair."

  embed_conversion_v1:
    name: "Vector Command v1.0"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "Initialize Global Combat."
        body: "Phalanx Duel v1.0 is officially active. Deterministic tactical battle on a 4x2 grid. Zero RNG. Full cross-platform competition. Red protects. Blue attacks. Execute the briefing."
        proof_points:
          - "Vector: 0% RNG"
          - "Open: Standard Deck"
          - "Tactical: 4x2 Grid"
        ctas:
          - label: "Enter the Duel"
            href: "#play-the-duel"
            style: "primary"
          - label: "Read the Rules"
            href: "/guide"
            style: "secondary"
        asset_id: "mkt-hero-breach"
        friction_line: "No account required. Logic is the only weapon."
        preview_panel:
          label: "TACTICAL_HUD"
          heading: "Formation is Destiny"
          subheading: "Ray-traced combat. Zero luck."
          rows:
            - label: "Defense"
              value: "♥ Heart + ♦ Diamond"
              href: "/learn/rules/"
            - label: "Offense"
              value: "♣ Club + ♠ Spade"
              href: "/learn/rules/"
            - label: "Simulation"
              value: "Combat Lab"
              href: "/tools/battle-calculator/"
          footer: "Red defends the line. Blue breaks it."

      - type: "cascade_visualizer"
        section_id: "the-math"

      - type: "card"
        class: "card"
        section_id: "play-the-duel"
        heading: "Command Console"
        body: "Initialize a duel directly from this terminal. Zero setup. Full tactical depth."
        embed:
          enabled: true
          src: "https://play.phalanxduel.com/"
          title: "Phalanx Duel Playable Embed"
          aspect_ratio: "16/9"
          sandbox: "allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
          allow: "clipboard-write; fullscreen"
          loading: "eager"
        ctas:
          - label: "Expand to Full Screen &rarr;"
            href: "/play/"
            style: "secondary"

      - type: "feature_showcase"
        class: "card"
        section_id: "the-killzone"
        heading: "Geometric Pressure."
        intro: "We stripped away the RNG. What remains is a pure system of kinetic energy and structural integrity."
        features:
          - heading: "01. Formation"
            body: "Your 4x2 grid is your survival. Every card is a tactical data-point. Deploy carefully to protect your line."
            asset_id: "tut-foundations-setup"
          - heading: "02. The Cascade"
            body: "Damage flows front-to-back. Choose between **Classic Mode** (Equal/Greater attack) or **Cumulative Mode** (Carryover damage)."
            asset_id: "tut-foundations-cascade"
          - heading: "03. Determinism"
            body: "Identical inputs. Identical outcomes. Your victory is not a roll of the dice; it is mathematical inevitability."
            image: "/assets/images/tutorial/qa-determinism.png"
        ctas:
          - label: "Enter the Combat Lab &rarr;"
            href: "/tools/battle-calculator/"
            style: "primary"

      - type: "welcome_dialog"
        heading: "WELCOME TO PHALANX DUEL"

      - type: "two_col_cards"
        class: "two-col"
        section_id: "cross-platform"
        cards:
          - heading: "Terminal Operative"
            body: "Battle from any command line. Our official Golang client provides a high-performance terminal experience with full session re-entry and OTel observability."
            cta:
              label: "Get the Go SDK"
              href: "https://github.com/phalanxduel/phalanxduel/tree/main/sdk/go"
          - heading: "Competitive Ladder (Beta)"
            body: "Climb the global Glicko-2 rankings. True cross-platform play across Web (all screens), CLI, and Mobile (SwiftUI in-progress) operatives."
            cta:
              label: "View Rankings"
              href: "/competitive/"

      - type: "card"
        class: "card"
        section_id: "the-death-of-luck"
        heading: "The Death of Luck"
        paragraphs:
          - "In Phalanx Duel, there are no coin flips. Identical inputs produce identical outcomes. Every combat result is hashable, verifiable, and mathematically inevitable. Your victory is yours alone."
        links_line:
          links:
            - label: "Read the System Philosophy"
              href: "/about/philosophy/"
            - label: "Analyze the Math"
              href: "/tools/battle-calculator/"
          conjunction: " or "
          suffix: "."

      - type: "card"
        class: "card"
        section_id: "feedback"
        heading: "Submit Debrief"
        body: "Phalanx Duel is in active playtesting. Your tactical feedback is critical to the system's evolution."
        bullets:
          - "Found a bug in the cascade math?"
          - "Discovered a dominant strategy?"
          - "Have a proposal for a new suit mechanic?"
        ctas:
          - label: "Report Bug (GitHub)"
            href: "https://github.com/phalanxduel/phalanxduel/issues"
            style: "primary"
            external: true
          - label: "Join the Discussion"
            href: "/contribute/playtesting/"
            style: "secondary"

      - type: "final_cta"
        class: "card"
        section_id: "final-strike"
        heading: "Ready to Duel?"
        body: "Initialize match. Share link. Start the duel in seconds."
        ctas:
          - label: "Start Match"
            href: "/play/"
            style: "primary"
            external: false
          - label: "Read the Rules"
            href: "/guide"
            style: "secondary"
        closing_microcopy: "Free. Fast. Fair."
