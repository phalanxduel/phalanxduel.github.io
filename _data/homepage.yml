meta:
  title: "Phalanx"
  description: "Phalanx is an open tactical card system for competitive and cooperative play."

active_variant: "expectations_conversion_v1"

variants:
  current:
    name: "Current homepage"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "Phalanx Duel: Column Tactics, Deterministic Combat"
        body: "Phalanx Duel turns card values and suits into a high-skill 1v1 battlefield. Build pressure across four columns, break through front-to-back defenses, and convert overflow into decisive life damage."
        ctas:
          - label: "Play Online &rarr;"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "Learn in 2 Minutes"
            href: "/how-to-play/"
            style: "secondary"
          - label: "Rules v1.0 Summary"
            href: "/rules/"

      - type: "card"
        class: "card"
        section_id: "curious-to-master"
        heading: "From Curious to Master"
        body: "Your journey in Phalanx Duel has a clear path. Start simple, practice solo, then compete for rank."
        intro: "How to go from 0 to 1, and 1 to \u221E."
        bullets:
          - "<strong>Curious (0 \u2192 1):</strong> Watch a match or play the <strong>Solo Bot (Easy)</strong>. No pressure, just learn the flow."
          - "<strong>Player (1 \u2192 10):</strong> Play the <strong>Solo Bot (Medium)</strong> to test your defense. Then challenge a friend."
          - "<strong>Master (10 \u2192 \u221E):</strong> Compete in ranked play. Study suit boundaries. Use the <strong>Battle Calculator</strong> to find lethal lines others miss."
        ctas:
          - label: "Play Solo Bot"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "Battle Calculator"
            href: "/battle-calculator/"
            style: "secondary"

      - type: "card"
        class: "card"
        section_id: "canonical-format"
        heading: "Start Here: The Canonical Duel Format"
        body_html: "<strong>Phalanx Duel</strong> is the canonical competitive format of the Phalanx system. Classic play uses a <strong>4-column, 2-rank battlefield</strong>, a <strong>4-card hand limit</strong>, and deterministic attack resolution with suit timing that rewards planning over guesswork."
        ctas:
          - label: "Your First Match"
            href: "/how-to-play/"
          - label: "Suits & Strategy"
            href: "/suits-strategy/"
            style: "secondary"
          - label: "Battle Calculator"
            href: "/battle-calculator/"

      - type: "grid_cards"
        class: "grid three"
        aria_label: "Phalanx Duel Progression"
        items:
          - heading: "Play"
            body: "Learn the board, choose attacks from the front rank, and feel how overflow damage moves through a defending column."
          - heading: "Improve"
            body: "Understand suit timing: Diamonds and Hearts mitigate, Clubs and Spades convert carryover into pressure."
          - heading: "Master"
            body: "Read attack boundaries correctly, exploit pass pressure, and plan reinforcement around column collapse."

      - type: "card"
        class: "card"
        section_id: "simplified-rules"
        heading: "Simplified Rules"
        body: "Phalanx Duel is a game of positioning and timing. Master these core concepts to win."
        bullets:
          - "<strong>Columns:</strong> Cards are arranged in 4 columns. Attacks hit the front card first, then the back, then you."
          - "<strong>Phases:</strong> Each turn has 7 fixed phases. You deploy in Reinforcement and strike in the Attack phase."
          - "<strong>Suits:</strong> ♦ Diamonds and ♥ Hearts defend; ♣ Clubs and ♠ Spades boost your attack power."
          - "<strong>Victory:</strong> Reduce your opponent to 0 LP or destroy their entire formation to win."
        ctas:
          - label: "Step-by-Step Tutorial &rarr;"
            href: "/tutorial/"
            style: "primary"
          - label: "Quick Reference"
            href: "/quick-reference/"
            style: "secondary"

      - type: "feature_showcase"
        class: "card"
        section_id: "gameplay-preview"
        heading: "Dynamic Gameplay"
        intro: "Experience deterministic, tactical card combat. Every move matters."
        features:
          - heading: "Deployment"
            body: "Strategic setup is key. Position your cards across 4 columns and 2 ranks to form an impenetrable line."
            image: "/assets/images/tutorial/deployment-start.png"
          - heading: "Tactical Attacks"
            body: "Strike from your front rank. Watch damage cascade through columns and overcome your opponent's defense."
            image: "/assets/images/tutorial/attack-phase.png"
          - heading: "Dynamic Reinforcement"
            body: "Rebuild your formation mid-battle. Deploy new cards to your back row as the front line shifts."
            image: "/assets/images/tutorial/reinforce-phase.png"
        ctas:
          - label: "Full Step-by-Step Tutorial &rarr;"
            href: "/tutorial/"
            style: "primary"

      - type: "card"
        class: "card"
        section_id: "why-fair"
        heading: "Why Competitive Players Trust It"
        paragraphs:
          - "Phalanx Duel’s canonical rules are deterministic: identical inputs produce identical outcomes. The game is designed for replay verification, event logging, and server-authoritative enforcement in digital play."
        links_line:
          links:
            - label: "See technical details"
              href: "/technical-details/"
            - label: "read the player-facing rules summary"
              href: "/rules/"
          conjunction: " and "
          suffix: "."

      - type: "two_col_cards"
        class: "two-col"
        cards:
          - heading: "Learn Fast"
            body: "Start with the short onboarding guide, then use the quick reference while you play."
            cta:
              label: "How to Play"
              href: "/how-to-play/"
          - heading: "Train Smarter"
            body: "Use the battle calculator and strategy notes to understand suit timing, overflow, and column outcomes."
            cta:
              label: "Analyze Battles"
              href: "/battle-calculator/"

      - type: "card"
        class: "card"
        section_id: "project-links"
        heading: "Project & Policy"
        body: "The engine and rules are open. Trademarks and certification are managed separately."
        ctas:
          - label: "License"
            href: "/license/"
          - label: "Trademarks"
            href: "/trademarks/"
          - label: "The System"
            href: "/system/"

      - type: "small_note"
        class: "small-note"
        prefix: "Ready to test your read on the board? Play online at "
        link:
          label: "play.phalanxduel.com"
          href: "https://play.phalanxduel.com"
          external: true
        suffix: "."

  conversion_strategy_v1:
    name: "Conversion strategy v1"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "Simple rules. Serious strategy."
        body: "Phalanx Duel is a tactical duel where positioning, timing, and prediction decide the outcome. Learn the basics in a minute, then uncover deeper counters, traps, and formations every time you play."
        ctas:
          - label: "Play Now"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "How to Play (60 sec)"
            href: "/how-to-play/"
            style: "secondary"
        friction_line: "Free to play in your browser. No download. Start instantly."
        proof_points:
          - "Learn fast, improve forever"
          - "Quick matches, meaningful choices"
          - "Built for mind games and mastery"

      - type: "feature_cards"
        class: "card"
        section_id: "why-it-hooks"
        heading: "Learn the basics fast. Stay for the mind games."
        body: "Phalanx Duel is easy to begin because the rules are clear. The challenge comes from what those rules create: pressure, traps, counters, and the constant battle to stay one move ahead."
        cards:
          - heading: "Clear Rules, Fast Start"
            body: "You do not need a long tutorial to begin. The core actions are simple, so your first match starts quickly and makes sense right away."
          - heading: "Every Move Matters"
            body: "Each decision changes the board. A strong move can create pressure, open a path, or bait your opponent into a mistake."
          - heading: "Depth That Rewards Practice"
            body: "As you play, you start seeing patterns, counters, and setups you missed before. That is where mastery begins."

      - type: "mechanics_cards"
        class: "card"
        section_id: "how-it-works"
        heading: "What makes a great move?"
        body: "Winning is not about memorizing rules. It is about reading the board and making the right decision at the right time."
        cards:
          - heading: "Positioning Wins Games"
            body: "Control space, protect key pieces, and shape the board in your favor."
          - heading: "Timing Creates Openings"
            body: "The right move too early can fail. The right move at the right moment can decide the match."
          - heading: "Prediction Beats Reaction"
            body: "Success comes from reading what your opponent wants and disrupting it before it happens."
        helper_line: "New player? Learn the essentials in 60 seconds, then improve by playing."

      - type: "steps_teaser"
        class: "card"
        section_id: "how-to-play-teaser"
        heading: "How to play in 60 seconds"
        intro: "Understand the goal, learn the core moves, and start playing. The strategy comes from how you combine them."
        steps:
          - heading: "Know the objective"
            body: "Win by creating the position your opponent cannot answer."
          - heading: "Learn the core moves"
            body: "Each turn, you make one move that changes space, pressure, and possibilities on the board."
          - heading: "Think one move ahead"
            body: "Do not just look at your move. Look at the reply it invites."
          - heading: "Build pressure"
            body: "Strong play comes from creating threats while protecting your position."
          - heading: "Play and improve"
            body: "Your first match teaches the basics. Every match after that teaches timing, counters, and pattern recognition."
        ctas:
          - label: "Play Your First Match"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "See Full Rules"
            href: "/rules/"
            style: "secondary"

      - type: "onboarding_choices"
        class: "card"
        section_id: "start-your-first-duel"
        heading: "Start your first duel your way"
        body: "Jump straight into a match, or take the 60-second rules tour first. Either way, you will be playing in moments."
        cards:
          - heading: "Play Now"
            body: "Learn by doing. Start a match instantly."
            cta:
              label: "Play Now"
              href: "https://play.phalanxduel.com"
              external: true
          - heading: "60-Second Rules"
            body: "Get the essentials, then jump in with confidence."
            cta:
              label: "How to Play"
              href: "/how-to-play/"
          - heading: "Practice First"
            body: "Test the basics before facing other players."
            cta:
              label: "Practice"
              href: "/practice/"
            optional: true
        helper_line: "No download. No long tutorial. Just a fast start and real strategy."

      - type: "final_cta"
        class: "card"
        section_id: "final-cta"
        heading: "Your next great move starts now."
        body: "Play your first match in minutes. Come back for the depth, the mind games, and the mastery."
        ctas:
          - label: "Play Now"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "How to Play"
            href: "/how-to-play/"
            style: "secondary"
        closing_microcopy: "Free in your browser. No download required."

