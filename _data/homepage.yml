meta:
  title: "Phalanx Duel"
  description: "A standard deck, sharpened. The deterministic tactical card battle."

active_variant: "tactical_v1"

variants:
  tactical_v1:
    name: "Tactical Overthrow v1"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "A Standard Deck, Sharpened."
        body: "Phalanx Duel is a deterministic tactical card battle. You already know the pieces. Now learn the battlefield. Build your formation, attack through the enemy line, and master a game where logic is the only weapon."
        proof_points:
          - "No RNG. No Boosters."
          - "Standard 52-Card Deck"
          - "Deterministic Combat"
        ctas:
          - label: "Play Online"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "Learn the Battlefield"
            href: "/learn/getting-started/"
            style: "secondary"
        friction_line: "Free. No account. Start instantly."
        preview_panel:
          label: "The Simulation"
          heading: "Master the Cascade"
          subheading: "Predictable combat. Deep consequences."
          rows:
            - label: "Tactics"
              value: "0 to 1 Walkthrough"
              href: "/learn/first-match/"
            - label: "The Lab"
              value: "Battle Simulator"
              href: "/tools/battle-calculator/"
            - label: "The Engine"
              value: "Open Source Code"
              href: "https://github.com/phalanxduel/phalanxduel"
              external: true
          footer: "Logic is the only weapon."

      - type: "feature_showcase"
        class: "card"
        section_id: "the-killzone"
        heading: "Digital Clarity. Tactical Brutalism."
        intro: "We stripped away the RNG and the collectible treadmill. What remains is a pure system of consequences."
        features:
          - heading: "The Lane"
            body: "Cards occupy a 4x2 grid. Every slot is a tactical decision. A hole in your line is a direct path to defeat."
            image: "/assets/images/tutorial/deployment-with-hand.png"
          - heading: "The Cascade"
            body: "Damage flows front-to-back. Destroy the front rank, break the reserves, and strike the heart."
            image: "/assets/images/tutorial/attack-with-hand.png"
          - heading: "The Reinforcement"
            body: "Rebuild under pressure. Move reserves forward and plug the gaps before the next wave hits."
            image: "/assets/images/tutorial/reinforce-phase.png"
        ctas:
          - label: "Enter the Tactics Hub &rarr;"
            href: "/learn/getting-started/"
            style: "primary"

      - type: "card"
        class: "card"
        section_id: "the-death-of-luck"
        heading: "The Death of Luck"
        paragraphs:
          - "In Phalanx Duel, there are no coin flips. Identical inputs produce identical outcomes. Every combat result is hashable, verifiable, and mathematically inevitable. Your victory is yours alone."
        links_line:
          links:
            - label: "Read the System Philosophy"
              href: "/about/philosophy/"
            - label: "Analyze the Math"
              href: "/tools/battle-calculator/"
          conjunction: " or "
          suffix: "."

      - type: "two_col_cards"
        class: "two-col"
        cards:
          - heading: "The Simulator"
            body: "Study attack boundaries, carryover math, and suit interactions in our high-fidelity combat lab."
            cta:
              label: "Open Simulator"
              href: "/tools/battle-calculator/"
          - heading: "The Forge"
            body: "The engine is open. We need designers, developers, and playtesters to sharpen the edge."
            cta:
              label: "Help Build It"
              href: "/contribute/"

      - type: "final_cta"
        class: "card"
        section_id: "final-strike"
        heading: "Ready to Duel?"
        body: "Create a match. Share a link. Start the duel in seconds."
        ctas:
          - label: "Start Match"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "First Match Walkthrough"
            href: "/learn/first-match/"
            style: "secondary"
        closing_microcopy: "Free. Fast. Fair."