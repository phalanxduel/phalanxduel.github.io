meta:
  title: "Phalanx"
  description: "Phalanx is an open tactical card system for competitive and cooperative play."

active_variant: "expectations_conversion_v1"

variants:
  current:
    name: "Current homepage"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "Phalanx Duel: Column Tactics, Deterministic Combat"
        body: "Phalanx Duel turns card values and suits into a high-skill 1v1 battlefield. Build pressure across four columns, break through front-to-back defenses, and convert overflow into decisive life damage."
        ctas:
          - label: "Play Online &rarr;"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "Official Tutorial"
            href: "/tutorial/"
            style: "secondary"
          - label: "Battle Calculator"
            href: "/battle-calculator/"

      - type: "feature_showcase"
        class: "card"
        section_id: "gameplay-preview"
        heading: "Dynamic Gameplay"
        intro: "Experience deterministic, tactical card combat. Every move matters."
        features:
          - heading: "Deployment"
            body: "Strategic setup is key. Position your cards across 4 columns and 2 ranks to form an impenetrable line."
            image: "/assets/images/tutorial/deployment-with-hand.png"
          - heading: "Tactical Attacks"
            body: "Strike from your front rank. Watch damage cascade through columns and overcome your opponent's defense."
            image: "/assets/images/tutorial/attack-with-hand.png"
          - heading: "Dynamic Reinforcement"
            body: "Rebuild your formation mid-battle. Deploy new cards to your back row as the front line shifts."
            image: "/assets/images/tutorial/reinforce-phase.png"
        ctas:
          - label: "Full Step-by-Step Tutorial &rarr;"
            href: "/tutorial/"
            style: "primary"

      - type: "card"
        class: "card"
        section_id: "curious-to-master"
        heading: "From Curious to Master"
        body: "Your journey in Phalanx Duel has a clear path. Start simple, practice solo, then compete for rank."
        intro: "How to go from 0 to 1, and 1 to \u221E."
        bullets:
          - "<strong>Curious (0 \u2192 1):</strong> Watch a match or play the <strong>Solo Bot (Easy)</strong>. No pressure, just learn the flow."
          - "<strong>Player (1 \u2192 10):</strong> Play the <strong>Solo Bot (Medium)</strong> to test your defense. Then challenge a friend."
          - "<strong>Master (10 \u2192 \u221E):</strong> Compete in ranked play. Study suit boundaries. Use the <strong>Battle Calculator</strong> to find lethal lines others miss."
        ctas:
          - label: "Play Solo Bot"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "Battle Calculator"
            href: "/battle-calculator/"
            style: "secondary"

      - type: "card"
        class: "card"
        section_id: "canonical-format"
        heading: "Start Here: The Canonical Duel Format"
        body_html: "<strong>Phalanx Duel</strong> is the canonical competitive format of the Phalanx system. Classic play uses a <strong>4-column, 2-rank battlefield</strong>, a <strong>4-card hand limit</strong>, and deterministic attack resolution with suit timing that rewards planning over guesswork."
        ctas:
          - label: "Official Tutorial"
            href: "/tutorial/"
          - label: "Suits & Strategy"
            href: "/suits-strategy/"
            style: "secondary"
          - label: "Battle Calculator"
            href: "/battle-calculator/"

      - type: "grid_cards"
        class: "grid three"
        aria_label: "Phalanx Duel Progression"
        items:
          - heading: "Play"
            body: "Learn the board, choose attacks from the front rank, and feel how overflow damage moves through a defending column."
          - heading: "Improve"
            body: "Understand suit timing: Diamonds and Hearts mitigate, Clubs and Spades convert carryover into pressure."
          - heading: "Master"
            body: "Read attack boundaries correctly, exploit pass pressure, and plan reinforcement around column collapse."

      - type: "card"
        class: "card"
        section_id: "simplified-rules"
        heading: "Simplified Rules"
        body: "Phalanx Duel is a game of positioning and timing. Master these core concepts to win."
        bullets:
          - "<strong>Columns:</strong> Cards are arranged in 4 columns. Attacks hit the front card first, then the back, then you."
          - "<strong>Phases:</strong> Each turn has 7 fixed phases. You deploy in Reinforcement and strike in the Attack phase."
          - "<strong>Suits:</strong> ♦ Diamonds and ♥ Hearts defend; ♣ Clubs and ♠ Spades boost your attack power."
          - "<strong>Victory:</strong> Reduce your opponent to 0 LP or destroy their entire formation to win."
        ctas:
          - label: "Step-by-Step Tutorial &rarr;"
            href: "/tutorial/"
            style: "primary"
          - label: "Quick Reference"
            href: "/quick-reference/"
            style: "secondary"

      - type: "card"
        class: "card"
        section_id: "why-fair"
        heading: "Why Competitive Players Trust It"
        paragraphs:
          - "Phalanx Duel’s canonical rules are deterministic: identical inputs produce identical outcomes. The game is designed for replay verification, event logging, and server-authoritative enforcement in digital play."
        links_line:
          links:
            - label: "See technical details"
              href: "/technical-details/"
            - label: "read the player-facing rules summary"
              href: "/rules/"
          conjunction: " and "
          suffix: "."

      - type: "two_col_cards"
        class: "two-col"
        cards:
          - heading: "Master the Basics"
            body: "Start with the official visual walkthrough of the game's mechanics and phases."
            cta:
              label: "Official Tutorial"
              href: "/tutorial/"
          - heading: "Analyze Strategy"
            body: "Use the battle calculator to understand suit timing, overflow, and column outcomes."
            cta:
              label: "Battle Calculator"
              href: "/battle-calculator/"

      - type: "card"
        class: "card"
        section_id: "project-links"
        heading: "Project & Policy"
        body: "The engine and rules are open. Trademarks and certification are managed separately."
        ctas:
          - label: "License"
            href: "/license/"
          - label: "Trademarks"
            href: "/trademarks/"
          - label: "The System"
            href: "/system/"

      - type: "small_note"
        class: "small-note"
        prefix: "Ready to test your read on the board? Play online at "
        link:
          label: "play.phalanxduel.com"
          href: "https://play.phalanxduel.com"
          external: true
        suffix: "."

  expectations_conversion_v1:
    name: "Expectations-first conversion v1"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "Start a duel in seconds."
        body: "Create a match. Share a link. Start the duel."
        proof_points:
          - "No account required"
          - "1 & 2 Player Modes (Solo vs Bot or PvP)"
          - "Create, Join, or Watch"
          - "Spectator link included"
        ctas:
          - label: "Create Match"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "Official Tutorial"
            href: "/tutorial/"
            style: "secondary"
          - label: "Battle Calculator"
            href: "/battle-calculator/"
        friction_line: "No download. No account required. Spectator link included."
        preview_panel:
          label: "Your Progression"
          heading: "From Curious to Master"
          subheading: "Go from 0 to 1, and 1 to \u221E."
          rows:
            - label: "Phase 0 (Curious)"
              value: "Read the board"
              href: "/tutorial/"
            - label: "Phase 1 (Player)"
              value: "Play Solo Bot (Easy)"
              href: "https://play.phalanxduel.com"
              external: true
            - label: "Phase 10 (Duelist)"
              value: "Challenge a Friend"
              href: "https://play.phalanxduel.com"
              external: true
            - label: "Phase \u221E (Master)"
              value: "Ranked + Battle Calculator"
              href: "/battle-calculator/"
          footer: "Start your first duel in seconds. No account needed."

      - type: "feature_showcase"
        class: "card"
        section_id: "gameplay-preview"
        heading: "Dynamic Gameplay"
        intro: "Experience deterministic, tactical card combat. Every move matters."
        features:
          - heading: "Deployment"
            body: "Strategic setup is key. Position your cards across 4 columns and 2 ranks to form an impenetrable line."
            image: "/assets/images/tutorial/deployment-with-hand.png"
          - heading: "Tactical Attacks"
            body: "Strike from your front rank. Watch damage cascade through columns and overcome your opponent's defense."
            image: "/assets/images/tutorial/attack-with-hand.png"
          - heading: "Dynamic Reinforcement"
            body: "Rebuild your formation mid-battle. Deploy new cards to your back row as the front line shifts."
            image: "/assets/images/tutorial/reinforce-phase.png"
        ctas:
          - label: "Full Step-by-Step Tutorial &rarr;"
            href: "/tutorial/"
            style: "primary"

      - type: "card"
        class: "card"
        section_id: "curious-to-master"
        heading: "From Curious to Master"
        body: "Your journey in Phalanx Duel has a clear path. Start simple, practice solo, then compete for rank."
        intro: "How to go from 0 to 1, and 1 to \u221E."
        bullets:
          - "<strong>Curious (0 \u2192 1):</strong> Watch a match or play the <strong>Solo Bot (Easy)</strong>. No pressure, just learn the flow."
          - "<strong>Player (1 \u2192 10):</strong> Play the <strong>Solo Bot (Medium)</strong> to test your defense. Then challenge a friend."
          - "<strong>Master (10 \u2192 \u221E):</strong> Compete in ranked play. Study suit boundaries. Use the <strong>Battle Calculator</strong> to find lethal lines others miss."
        ctas:
          - label: "Play Solo Bot"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "Battle Calculator"
            href: "/battle-calculator/"
            style: "secondary"

      - type: "card"
        class: "card"
        section_id: "simplified-rules"
        heading: "Simplified Rules"
        body: "Phalanx Duel is a game of positioning and timing. Master these core concepts to win."
        bullets:
          - "<strong>Columns:</strong> Cards are arranged in 4 columns. Attacks hit the front card first, then the back, then you."
          - "<strong>Phases:</strong> Each turn has 7 fixed phases. You deploy in Reinforcement and strike in the Attack phase."
          - "<strong>Suits:</strong> ♦ Diamonds and ♥ Hearts defend; ♣ Clubs and ♠ Spades boost your attack power."
          - "<strong>Victory:</strong> Reduce your opponent to 0 LP or destroy their entire formation to win."
        ctas:
          - label: "Step-by-Step Tutorial &rarr;"
            href: "/tutorial/"
            style: "primary"
          - label: "Quick Reference"
            href: "/quick-reference/"
            style: "secondary"

      - type: "steps_teaser"
        class: "card"
        section_id: "how-a-turn-works"
        heading: "How a turn works"
        intro: "Players take turns. The game and each turn have phases, and the current phase determines whether you deploy cards or attack."
        steps:
          - heading: "Start and set the duel"
            body: "Create or join a match in the browser. The current alpha lobby lets you choose Damage Mode and Starting LP, while the canonical Classic defaults are documented in Rules v1.0."
          - heading: "Set up the battlefield"
            body: "In canonical Classic setup, each player draws 12 cards and alternates deployment until all 8 slots are filled (4 columns x 2 ranks) with 4 cards left in hand."
          - heading: "Take turns through 7 phases"
            body: "Each turn follows the same deterministic lifecycle: Start Turn, Attack Phase, Attack Resolution, Cleanup, Reinforcement, Draw, End Turn."
          - heading: "Attack from the front rank"
            body: "On attack phases, the active player attacks from a front-rank card in one column into a chosen defending column."
          - heading: "Damage cascades through columns"
            body: "Damage moves through a defending column and can carry into LP based on the board state and card effects."
          - heading: "Push to victory"
            body: "Keep attacking and deploying through the turn and game phases until an opponent reaches 0 LP or every card they have is destroyed."
        helper_line: "You do not need every suit interaction memorized before your first game. Play one match, then use our primary resources as questions come up."
        ctas:
          - label: "Official Tutorial"
            href: "/tutorial/"
            style: "primary"
          - label: "Battle Calculator"
            href: "/battle-calculator/"
            style: "secondary"

      - type: "feature_cards"
        class: "card"
        section_id: "what-you-need-to-know"
        heading: "What you need to know (and what can wait)"
        body: "You do not need the full rules memorized before starting. Learn the basics first, then use the deeper rule pages and tools as you improve."
        cards:
          - heading: "Start a game"
            body: "Enter your name, choose match settings (or keep defaults), create a match, and share the player link."
          - heading: "Learn the core loop"
            body: "Understand how turns and phases shape when you deploy or attack."
          - heading: "Go deeper later"
            body: "Use the step-by-step tutorial, then the full rules, strategy notes, and calculator when you want mastery."

      - type: "two_col_cards"
        class: "two-col"
        cards:
          - heading: "Official Tutorial"
            body: "Start with the shortest path: a visual walkthrough of the goal, turns, and basic combat."
            cta:
              label: "See Tutorial"
              href: "/tutorial/"
          - heading: "Battle Calculator"
            body: "When you want exact resolution details and strategy depth, use the authoritative damage simulator."
            cta:
              label: "Analyze Battles"
              href: "/battle-calculator/"

      - type: "final_cta"
        class: "card"
        section_id: "final-cta"
        heading: "Start your first duel today."
        body: "Enter your name, create a link, invite a friend, and begin as soon as they join."
        ctas:
          - label: "Create Match"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "Step-by-Step Tutorial"
            href: "/tutorial/"
            style: "secondary"
        closing_microcopy: "No download. No account required. Every match includes a spectator link."
