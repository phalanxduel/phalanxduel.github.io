meta:
  title: "Phalanx Duel"
  description: "A standard deck, sharpened. The deterministic tactical card battle."

active_variant: "embed_conversion_v1"

variants:
  tactical_v1:
    name: "Tactical Overthrow v1"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "The Collision of Lines."
        body: "Phalanx Duel is a deterministic tactical battle on a 4x2 grid. No luck. No boosters. Just the geometric consequence of your deployment. Red protects. Blue attacks. Master the cascade."
        proof_points:
          - "Deterministic: 0% RNG"
          - "Open: Standard 52-Card Deck"
          - "Tactical: 4x2 Formation Grid"
        ctas:
          - label: "Enter the Duel"
            href: "/play/"
            style: "primary"
            external: false
          - label: "Study the Cascade"
            href: "/learn/getting-started/"
            style: "secondary"
        friction_line: "No account required. Logic is the only weapon."
        preview_panel:
          label: "The Front Rank"
          heading: "Formation is Destiny"
          subheading: "Predictable combat. Zero luck."
          rows:
            - label: "Defense"
              value: "♥ Heart + ♦ Diamond"
              href: "/learn/rules/"
            - label: "Offense"
              value: "♣ Club + ♠ Spade"
              href: "/learn/rules/"
            - label: "Simulation"
              value: "Battle Lab"
              href: "/tools/battle-calculator/"
          footer: "Red defends the line. Blue breaks it."

      - type: "feature_showcase"
        class: "card"
        section_id: "the-killzone"
        heading: "A System of Consequences."
        intro: "We stripped away the RNG. What remains is a pure system of geometric pressure and structural integrity."
        features:
          - heading: "01. Formation"
            body: "Your 4x2 grid is your survival. A gap in the front rank is an invitation to destruction. Every card is a tactical decision."
            image: "/assets/images/tutorial/deployment-with-hand.png"
          - heading: "02. The Cascade"
            body: "Damage flows front-to-back. Suits like Diamonds and Clubs modify the kinetic energy as it breaches each rank."
            image: "/assets/images/tutorial/attack-with-hand.png"
          - heading: "03. Determinism"
            body: "Identical inputs. Identical outcomes. Your victory is not a roll of the dice; it is the mathematical inevitable."
            image: "/assets/images/tutorial/reinforce-phase.png"
        ctas:
          - label: "Enter the Combat Lab &rarr;"
            href: "/tools/battle-calculator/"
            style: "primary"

      - type: "card"
        class: "card"
        section_id: "the-death-of-luck"
        heading: "The Death of Luck"
        paragraphs:
          - "In Phalanx Duel, there are no coin flips. Identical inputs produce identical outcomes. Every combat result is hashable, verifiable, and mathematically inevitable. Your victory is yours alone."
        links_line:
          links:
            - label: "Read the System Philosophy"
              href: "/about/philosophy/"
            - label: "Analyze the Math"
              href: "/tools/battle-calculator/"
          conjunction: " or "
          suffix: "."

      - type: "two_col_cards"
        class: "two-col"
        cards:
          - heading: "The Simulator"
            body: "Study attack boundaries, carryover math, and suit interactions in our high-fidelity combat lab."
            cta:
              label: "Open Simulator"
              href: "/tools/battle-calculator/"
          - heading: "The Forge"
            body: "The engine is open. We need designers, developers, and playtesters to sharpen the edge."
            cta:
              label: "Help Build It"
              href: "/contribute/"

      - type: "final_cta"
        class: "card"
        section_id: "final-strike"
        heading: "Ready to Duel?"
        body: "Create a match. Share a link. Start the duel in seconds."
        ctas:
          - label: "Start Match"
            href: "/play/"
            style: "primary"
            external: false
          - label: "First Match Walkthrough"
            href: "/learn/first-match/"
            style: "secondary"
        closing_microcopy: "Free. Fast. Fair."

  embed_conversion_v1:
    name: "Embed Conversion v1"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "The Collision of Lines."
        body: "Phalanx Duel is a deterministic tactical battle on a 4x2 grid. No luck. No boosters. Just the geometric consequence of your deployment. Red protects. Blue attacks. Master the cascade."
        proof_points:
          - "Deterministic: 0% RNG"
          - "Open: Standard 52-Card Deck"
          - "Tactical: 4x2 Formation Grid"
        ctas:
          - label: "Scroll to Play"
            href: "#play-the-duel"
            style: "primary"
          - label: "Study the Cascade"
            href: "/learn/getting-started/"
            style: "secondary"
        friction_line: "No account required. Logic is the only weapon."
        preview_panel:
          label: "The Front Rank"
          heading: "Formation is Destiny"
          subheading: "Predictable combat. Zero luck."
          rows:
            - label: "Defense"
              value: "♥ Heart + ♦ Diamond"
              href: "/learn/rules/"
            - label: "Offense"
              value: "♣ Club + ♠ Spade"
              href: "/learn/rules/"
            - label: "Simulation"
              value: "Battle Lab"
              href: "/tools/battle-calculator/"
          footer: "Red defends the line. Blue breaks it."

      - type: "card"
        class: "card"
        section_id: "play-the-duel"
        heading: "Initialize Combat"
        body: "Launch a duel directly from this console. Zero setup. Full tactical depth."
        embed:
          enabled: true
          src: "https://play.phalanxduel.com/"
          title: "Phalanx Duel Playable Embed"
          aspect_ratio: "16/9"
          sandbox: "allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
          allow: "clipboard-write; fullscreen"
          loading: "eager"
        ctas:
          - label: "Open in Full App &rarr;"
            href: "/play/"
            style: "secondary"

      - type: "feature_showcase"
        class: "card"
        section_id: "the-killzone"
        heading: "A System of Consequences."
        intro: "We stripped away the RNG. What remains is a pure system of geometric pressure and structural integrity."
        features:
          - heading: "01. Formation"
            body: "Your 4x2 grid is your survival. A gap in the front rank is an invitation to destruction. Every card is a tactical decision."
            image: "/assets/images/tutorial/deployment-with-hand.png"
          - heading: "02. The Cascade"
            body: "Damage flows front-to-back. Suits like Diamonds and Clubs modify the kinetic energy as it breaches each rank."
            image: "/assets/images/tutorial/attack-with-hand.png"
          - heading: "03. Determinism"
            body: "Identical inputs. Identical outcomes. Your victory is not a roll of the dice; it is the mathematical inevitable."
            image: "/assets/images/tutorial/reinforce-phase.png"
        ctas:
          - label: "Enter the Combat Lab &rarr;"
            href: "/tools/battle-calculator/"
            style: "primary"

      - type: "card"
        class: "card"
        section_id: "the-death-of-luck"
        heading: "The Death of Luck"
        paragraphs:
          - "In Phalanx Duel, there are no coin flips. Identical inputs produce identical outcomes. Every combat result is hashable, verifiable, and mathematically inevitable. Your victory is yours alone."
        links_line:
          links:
            - label: "Read the System Philosophy"
              href: "/about/philosophy/"
            - label: "Analyze the Math"
              href: "/tools/battle-calculator/"
          conjunction: " or "
          suffix: "."

      - type: "card"
        class: "card"
        section_id: "feedback"
        heading: "Report for Debrief"
        body: "Phalanx Duel is in active playtesting. Your tactical feedback is critical to the system's evolution."
        bullets:
          - "Found a bug in the cascade math?"
          - "Discovered a dominant strategy?"
          - "Have a proposal for a new suit mechanic?"
        ctas:
          - label: "Submit Feedback (GitHub)"
            href: "https://github.com/phalanxduel/phalanxduel/issues"
            style: "primary"
            external: true
          - label: "Join the Playtest Discussion"
            href: "/contribute/playtesting/"
            style: "secondary"

      - type: "final_cta"
        class: "card"
        section_id: "final-strike"
        heading: "Ready to Duel?"
        body: "Create a match. Share a link. Start the duel in seconds."
        ctas:
          - label: "Start Match"
            href: "/play/"
            style: "primary"
            external: false
          - label: "First Match Walkthrough"
            href: "/learn/first-match/"
            style: "secondary"
        closing_microcopy: "Free. Fast. Fair."
