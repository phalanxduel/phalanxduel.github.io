meta:
  title: "Phalanx Duel"
  description: "A deterministic tactical card battle played with a standard deck. Fast to learn, deep to master."

active_variant: "funnel_v1"

variants:
  funnel_v1:
    name: "Conversion Funnel v1"
    sections:
      - type: "hero"
        class: "hero"
        aria_labelledby: "hero-title"
        title_id: "hero-title"
        heading: "Simple rules. Serious strategy."
        body: "Phalanx Duel is a deterministic tactical card battle played with a standard deck. Build your formation, attack through the enemy line, and master a game that is quick to start and deep enough to study."
        proof_points:
          - "Standard deck, no booster treadmill"
          - "Deterministic resolution"
          - "Visible battlefield, pure tactics"
        ctas:
          - label: "Play Now"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "First Match Walkthrough"
            href: "/learn/first-match/"
            style: "secondary"
        friction_line: "Free in your browser. No download. Start instantly."
        preview_panel:
          label: "Your Progression"
          heading: "0 to Mastery"
          subheading: "A game with an endless skill ceiling."
          rows:
            - label: "Curious"
              value: "Read the rules"
              href: "/learn/getting-started/"
            - label: "Player"
              value: "Play your first match"
              href: "https://play.phalanxduel.com"
              external: true
            - label: "Competitor"
              value: "Study tactical patterns"
              href: "/improve/tactical-patterns/"
            - label: "Master"
              value: "Use the Battle Calculator"
              href: "/tools/battle-calculator/"
          footer: "Start your first duel in seconds."

      - type: "feature_showcase"
        class: "card"
        section_id: "gameplay-preview"
        heading: "Dynamic Gameplay, Visible Threats"
        intro: "Read the board, read the opponent, and execute your strategy."
        features:
          - heading: "Tactical Deployment"
            body: "Position your forces across 4 columns and 2 ranks. Build a wall, or bait a trap."
            image: "/assets/images/tutorial/deployment-with-hand.png"
          - heading: "Cascade Attacks"
            body: "Strike from the front rank. Damage carries through the enemy column to hit their Life Points directly."
            image: "/assets/images/tutorial/attack-with-hand.png"
          - heading: "Dynamic Reinforcement"
            body: "Rebuild your formation mid-battle. Plug holes in your defense, or prepare your next assault."
            image: "/assets/images/tutorial/reinforce-phase.png"
        ctas:
          - label: "Learn the Basics (3 min) &rarr;"
            href: "/learn/getting-started/"
            style: "primary"

      - type: "card"
        class: "card"
        section_id: "why-fair"
        heading: "Why Competitive Players Trust It"
        paragraphs:
          - "Phalanx Duel's canonical rules are strictly deterministic. Identical inputs produce identical outcomes. The game is designed for replay verification, event logging, and server-authoritative enforcement, meaning true tactical skill is the only path to victory."
        links_line:
          links:
            - label: "Read the canonical rules"
              href: "/learn/rules/"
            - label: "Read about our philosophy"
              href: "/about/philosophy/"
          conjunction: " and "
          suffix: "."

      - type: "two_col_cards"
        class: "two-col"
        cards:
          - heading: "Train Smarter"
            body: "Use the battle calculator to visualize attack chains, suit interactions, and carryover damage."
            cta:
              label: "Analyze Battles"
              href: "/tools/battle-calculator/"
          - heading: "Help Build It"
            body: "The engine and rules are open source. We need developers, writers, and playtesters."
            cta:
              label: "Get Involved"
              href: "/contribute/"

      - type: "final_cta"
        class: "card"
        section_id: "final-cta"
        heading: "Start your first duel today."
        body: "Enter your name, create a link, invite a friend, and begin as soon as they join."
        ctas:
          - label: "Create Match"
            href: "https://play.phalanxduel.com"
            style: "primary"
            external: true
          - label: "First Match Walkthrough"
            href: "/learn/first-match/"
            style: "secondary"
        closing_microcopy: "No download. No account required. Every match includes a spectator link."