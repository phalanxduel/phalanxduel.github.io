name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Repo policy requires all actions to be pinned to full commit SHAs.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 25

      - name: Setup Ruby
        uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd
        with:
          ruby-version: 4.0.1
          bundler-cache: false

      - name: Install dependencies
        run: |
          bundle config set path vendor/bundle
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Jekyll output
        run: ./bin/pipeline build

      - name: Run tests (RSpec + QUnit)
        run: ./bin/pipeline test

      - name: Validate built output (semantic + HTML)
        run: ./bin/pipeline validate

      - name: Browser a11y audit
        run: ./bin/pipeline a11y

      - name: Playwright smoke check
        run: ./bin/pipeline smoke

      - name: Upload Pages artifact
        # v4 is required here because it pins its internal upload-artifact action to a full SHA.
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
