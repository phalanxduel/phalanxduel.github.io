name: Build and Validate Site

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Repo policy requires all actions to be pinned to full commit SHAs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 25

      - name: Set up Ruby
        uses: ruby/setup-ruby@3ff19f52327de0469603769359d0df0f3f096210
        with:
          ruby-version: 4.0.2
          bundler-cache: false

      - name: Install Ruby dependencies
        run: |
          bundle config set path vendor/bundle
          bundle config unset without || true
          bundle config set with development
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4

      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Jekyll output
        run: ./bin/pipeline build

      - name: Run tests (RSpec + QUnit)
        run: ./bin/pipeline test

      - name: Validate built output (semantic + HTML)
        run: ./bin/pipeline validate

      - name: Browser a11y audit
        run: ./bin/pipeline a11y

      - name: Playwright smoke check
        run: ./bin/pipeline smoke
