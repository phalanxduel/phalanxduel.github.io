name: Build and Validate Site

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 25

      - name: Set up Ruby
        uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd
        with:
          ruby-version: 3.4.8
          bundler-cache: false

      - name: Install Ruby dependencies
        run: |
          bundle config set path vendor/bundle
          bundle config unset without || true
          bundle config set with development
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4

      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and validate Jekyll output
        run: ./bin/pipeline ci

      - name: Playwright smoke check
        run: ./bin/pipeline smoke
